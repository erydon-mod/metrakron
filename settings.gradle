pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        maven { url = 'https://maven.kikugie.dev/snapshots' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.7'
    id 'dev.kikugie.loom-back-compat' version '0.4.2'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

stonecutter {
    create(rootProject) {
        versions('1.18.2', '1.19.2', '1.19.4', '1.20.1', '1.20.4', '1.20.6', '1.21.1', '1.21.4', '1.21.8', '1.21.11', '26.1.2', '26.2')
        vcsVersion = '1.20.1'
    }
}

rootProject.name = 'metrakron-fabric-universal'

include 'smoke1201', 'smoke12111', 'smoke262'
project(':smoke1201').projectDir = file('tools/smoke/1.20.1')
project(':smoke12111').projectDir = file('tools/smoke/1.21.11')
project(':smoke262').projectDir = file('tools/smoke/26.2')
