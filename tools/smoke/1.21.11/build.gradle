plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.17.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    runtimeOnly rootProject.files(rootProject.tasks.named('smokeBundle12111'))
}

loom {
    runs {
        client {
            name 'Metrakron Universal 1.21.11 Smoke Client'
            runDir rootProject.layout.buildDirectory.dir('smoke-runs/1.21.11').get().asFile.absolutePath
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
