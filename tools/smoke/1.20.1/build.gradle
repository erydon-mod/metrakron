plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.11+1.20.1'
    runtimeOnly rootProject.files(rootProject.tasks.named('smokeBundle1201'))
}

loom {
    runs {
        client {
            name 'Metrakron Universal 1.20.1 Smoke Client'
            runDir rootProject.layout.buildDirectory.dir('smoke-runs/1.20.1').get().asFile.absolutePath
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}
