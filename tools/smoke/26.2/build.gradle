plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.158.0+26.2'
    runtimeOnly rootProject.files(rootProject.tasks.named('smokeBundle262'))
}

loom {
    runs {
        client {
            name 'Metrakron Universal 26.2 Smoke Client'
            runDir rootProject.layout.buildDirectory.dir('smoke-runs/26.2').get().asFile.absolutePath
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
